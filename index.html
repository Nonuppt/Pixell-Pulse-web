<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixell Pulse</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

/* Header */
header{
    padding:20px;
    font-size:28px;
    font-weight:bold;
    text-align:center;
    background:#000;
    position: sticky;
    top:0;
    z-index:10;
}

/* Search */
.search{
    padding:15px;
    text-align:center;
    background:#111;
    position: sticky;
    top:68px;
    z-index:10;
}

.search input{
    width:90%;
    max-width:600px;
    padding:12px 20px;
    border-radius:20px;
    border:1px solid #333;
    font-size:16px;
    background:#222;
    color:#fff;
    outline:none;
}

/* Categories */
.categories{
    display:flex;
    gap:10px;
    padding:15px 10px;
    overflow-x:auto;
    background:#111;
}
.categories::-webkit-scrollbar{ display:none; }

.categories button{
    background:#222;
    color:white;
    border:1px solid #555;
    padding:8px 18px;
    border-radius:20px;
    font-size:14px;
    white-space:nowrap;
    cursor:pointer;
}
.categories button.active{
    background:#00ff88;
    color:#000;
    border-color:#00ff88;
    font-weight:bold;
}

/* Movies Grid */
.movies{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    padding:15px;
}

@media(min-width: 768px){
    .movies{ grid-template-columns:repeat(4,1fr); }
}

    background:#1c1c1c;
    border-radius:12px;
    overflow:hidden;
    transition: transform 0.2s, box-shadow 0.2s;
}
