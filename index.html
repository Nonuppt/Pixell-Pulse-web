<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixell Pulse</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

/* Header */

header{
    padding:20px;
    font-size:28px;
    font-weight:bold;
    text-align:center;
    background:#000;
}

/* Search */

.search{
    padding:15px;
    text-align:center;
}

.search input{
    width:90%;
    padding:12px;
    border-radius:20px;
    border:none;
    font-size:16px;
}

/* Categories */

.categories{
    display:flex;
    gap:10px;
    padding:10px;
    overflow:auto;
}

.categories button{
    background:#222;
    color:white;
    border:1px solid #555;
    padding:8px 15px;
    border-radius:20px;
}

/* Movies */

.movies{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    padding:15px;
}

.card{
    background:#1c1c1c;
    border-radius:10px;
    overflow:hidden;
}

.card img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
}

.info{
    padding:10px;
}

.info h3{
    font-size:16px;
}

.info p{
    color:#aaa;
    font-size:13px;
    margin-top:5px;
}

</style>

</head>

<body>


<header>
🎬 Pixell Pulse
</header>


<div class="search">
<input placeholder="Search Movies & Series...">
</div>


<div class="categories">

<button>Movies</button>
<button>Web Series</button>
<button>Anime</button>
<button>Hindi Dubbed</button>
<button>Hollywood</button>

</div>



<div class="movies">


<a href="movie.html" style="text-decoration:none;color:white;">

<div class="card">

<img src="https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg">

<div class="info">
<h3>Loki</h3>
<p>2021 • Series</p>
</div>

</div>

</a>


<div class="card">

<img src="https://image.tmdb.org/t/p/w500/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg">

<div class="info">
<h3>The Shawshank Redemption</h3>
<p>1994 • Movie</p>
</div>

</div>


</div>


</body>
</html>
