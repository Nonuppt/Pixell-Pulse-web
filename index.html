<!DOCTYPE html>
<html>
<head>
    <title>Pixell Pulse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            background:#111;
            color:white;
            font-family:Arial;
            margin:0;
        }

        header{
            padding:20px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
        }

        .movies{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:15px;
            padding:15px;
        }

        .card{
            background:#222;
            border-radius:10px;
            overflow:hidden;
        }

        .card img{
            width:100%;
            aspect-ratio:2/3;
            object-fit:cover;
        }

        .title{
            padding:10px;
            text-align:center;
        }
    </style>
</head>

<body>

<header>
🎬 Pixell Pulse
</header>

<div class="movies">

<div class="card">
<img src="https://via.placeholder.com/300x450">
<div class="title">Movie Name</div>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x450">
<div class="title">Another Movie</div>
</div>

</div>

</body>
</html>
